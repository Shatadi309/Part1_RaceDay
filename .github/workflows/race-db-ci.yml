name: RaceDay Database CI (SQLite)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-sql-sqlite:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install SQLite
      run: sudo apt-get update && sudo apt-get install -y sqlite3
    
    - name: Convert SQL Server to SQLite
      run: |
        # Create a SQLite compatible version
        sed -e 's/identity(1,1)/AUTOINCREMENT/g' \
            -e 's/primary key identity(1,1)/PRIMARY KEY AUTOINCREMENT/g' \
            -e 's/varchar(MAX)/TEXT/g' \
            -e 's/varchar(150)/TEXT/g' \
            -e 's/varchar(255)/TEXT/g' \
            -e 's/varchar(50)/TEXT/g' \
            -e 's/varchar(100)/TEXT/g' \
            -e 's/nvarchar(10)/TEXT/g' \
            -e 's/nvarchar(150)/TEXT/g' \
            -e 's/nvarchar(50)/TEXT/g' \
            -e 's/char(10)/TEXT/g' \
            -e 's/date/TEXT/g' \
            -e 's/time/TEXT/g' \
            -e 's/decimal(10,2)/REAL/g' \
            -e 's/drop database RaceDay;/-- drop database RaceDay;--/g' \
            ${{ github.workspace }}/--creating\ a\ database\ called\ RaceDay--.txt > RaceDay.sqlite.sql
    
    - name: Create SQLite database
      run: |
        sqlite3 RaceDay.db < RaceDay.sqlite.sql
    
    - name: Verify database
      run: |
        echo "--- Tables ---"
        sqlite3 RaceDay.db ".tables"
        
        echo -e "\n--- Schema ---"
        sqlite3 RaceDay.db ".schema"
        
        echo -e "\n--- Data Counts ---"
        sqlite3 RaceDay.db "SELECT 'Users: ' || COUNT(*) FROM users"
        sqlite3 RaceDay.db "SELECT 'Events: ' || COUNT(*) FROM event"
        sqlite3 RaceDay.db "SELECT 'Categories: ' || COUNT(*) FROM category"
        sqlite3 RaceDay.db "SELECT 'Enrolments: ' || COUNT(*) FROM enrolment"
        sqlite3 RaceDay.db "SELECT 'Results: ' || COUNT(*) FROM result"
        
        echo -e "\n--- Sample Data ---"
        sqlite3 RaceDay.db "SELECT * FROM users LIMIT 5"
        sqlite3 RaceDay.db "SELECT * FROM event LIMIT 5"
        sqlite3 RaceDay.db "SELECT * FROM category LIMIT 5"
    
    - name: Run validation queries
      run: |
        sqlite3 RaceDay.db "
        -- Check for any errors
        SELECT 'Database validation completed successfully';
        
        -- Show event categories
        SELECT e.eventName, c.categoryName 
        FROM event e 
        JOIN eventCategory ec ON e.eventID = ec.eventID 
        JOIN category c ON ec.categoryID = c.categoryID;
        
        -- Show enrolments with user and event info
        SELECT u.fullName, e.eventName, en.enrolmentDate, en.paymentStatus 
        FROM enrolment en
        JOIN users u ON en.userID = u.userID
        JOIN eventCategory ec ON en.eventCategoryID = ec.eventCategoryID
        JOIN event e ON ec.eventID = e.eventID
        LIMIT 5;
        "
